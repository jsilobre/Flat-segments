name: Pages

# Publishes web/ to GitHub Pages. Requires Settings -> Pages -> Source:
# "GitHub Actions" (the first run fails until Pages is enabled).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        working-directory: web
        run: node --test
      - name: Assemble the site (without tests)
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/filters.js web/tiles.js web/style.css _site/
          cp -r web/data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
