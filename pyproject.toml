[project]
name = "flat-segments"
version = "0.1.0"
description = "Find short flat stretches and hills for running workouts near a GPS position."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jsilobre" }]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "numpy>=2.0",
    "osmium>=4.0",
    "pyarrow>=16",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "shapely>=2.0",
    "typer>=0.12",
]

[project.scripts]
flat-segments = "flat_segments.cli:app"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flat_segments"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
    "SIM",          # simplify
    "N",            # naming
    "PIE", "RET",   # misc. simplifications
    "PTH",          # pathlib
    "NPY",          # numpy
    "PT",           # pytest style
    "D",            # docstrings
    "RUF",          # ruff-specific
]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["osmium.*", "rasterio.*", "geopandas.*", "shapely.*", "pyarrow.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # rasterio still uses the deprecated `Affine * tuple` operator internally.
    "ignore:Use `@` matmul:PendingDeprecationWarning:rasterio",
]
